name: Release

# Add release-notes/vX.Y.md (and bump versionName) on main → build a signed APK → publish release vX.Y.
# A tag push v* or a manual run works too. The app's built-in updater picks the release up automatically.
on:
  push:
    branches: [main]
    paths: ['release-notes/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          # ubuntu-24.04 ships the Android SDK; install the pieces this project needs
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmd.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the signing secrets first (see README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > polaris.jks
          printf 'storeFile=polaris.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          # network hiccups (Maven/Gradle 5xx, timeouts) happen; retry before giving up
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break; [ $i = 3 ] && exit 1; echo "retry $i"; sleep 20; done
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "PolarisSMS-$VERSION.apk"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          NOTES="release-notes/v$VERSION.md"; [ -f "$NOTES" ] || NOTES=/dev/null
          echo "NOTES=$NOTES" >> $GITHUB_ENV

      # nothing after the build needs the signing key
      - name: Remove signing key
        run: rm -f polaris.jks keystore.properties

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Polaris SMS ${{ env.VERSION }}
          body_path: ${{ env.NOTES }}
          files: PolarisSMS-${{ env.VERSION }}.apk
          make_latest: true
